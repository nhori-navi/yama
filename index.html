<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>山座同定</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
*{box-sizing:border-box}

<body>
<div id="map"></div>
<div id="ctrl">

  目の高さ <input id="eye" type="number" value="2" min="0" step="1">m

  </div>

  <div id="err"></div>
</div>
<div id="panoBox"><div id="panoWrap"><canvas id="pano"></canvas></div><div id="center"></div></div>
<div id="info">山名をタップすると詳細が出ます</div>
<div class="small">スマホは写真を撮るときのように立てて持ってください。方角がずれるときは補正ボタンで合わせます。高さ方向は強調して描いています。茶色の山名は日本百名山です。<br>
<span id="storeInfo"></span> <button id="refreshBtn">山の一覧を取り直す</button><br>
標高：国土地理院 標高タイル／山名：Wikidata、© OpenStreetMap contributors</div>
<script>
const TOKEN = 'pk.eyJ1IjoiaG9yaWhha28iLCJhIjoiY211djd0ejljMDA5ZjMycHYxaTY3M3BsdSJ9.a1yefJYynC4k_YvllM5DVw';
mapboxgl.accessToken = TOKEN;
const $ = id => document.getElementById(id);
const DEF = [139.38, 35.61]; // 現在地が取れないときの地点（南大沢付近）
const R = 6371000, K = 0.13;          // 地球の半径、光の曲がり具合
const MAXD = 150000, NEAR = 15000;    // 計算する範囲、細かい地形を使う範囲（m）
const STEP = 0.2, PXD = 12;           // 稜線を計算する角度の刻み、横1度あたりの幅
const OFF = 60;                       // 北をまたいでつなげるための左右の余白（度）
const WAIT = 30000, WD_WAIT = 70000;  // 問い合わせを待つ上限（ミリ秒）
const FETCH_KM = 200;                 // Wikidataから一度に取る半径（km）
const STORE = 'yama_peaks_v2', KEEP_DAYS = 30;
const WD = 'https://query.wikidata.org/sparql?format=json&query=';
// 細かい山（OpenStreetMap）：縦横1度のマスごとに取ってスマホへ保存
const OSM_STORE = 'yama_osm_v1', OSM_DAYS = 90, OSM_MAX = 40;
const OSM_RETRY = 3, OSM_PAUSE = 30; // 3か所とも失敗したとき、30秒待ってやり直す回数
const MIRRORS = [ // 上から順に試す
  {name:'本家', url:'https://overpass-api.de/api/interpreter'},
  {name:'VK Maps', url:'https://maps.mail.ru/osm/tools/overpass/api/interpreter'},
  {name:'private.coffee', url:'https://overpass.private.coffee/api/interpreter'}
];
const BANDS = [10000, 30000, 70000, 150000];
const COLS = ['#4a5a6e', '#6b7f9a', '#93a5bd', '#c3cfdf'];
const DIR8 = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
const TOP = 118, AXIS = 22, H = 360;

const map = new mapboxgl.Map({container:'map', style:'mapbox://styles/mapbox/outdoors-v12', center:DEF, zoom:9});
map.addControl(new mapboxgl.NavigationControl(), 'top-right');

let obs = null, obsMarker = null, pick = false, running = false, note = '', curH0 = 0, srcName = '';
let prof = null, baseVis = [], extraVis = [], extraFor = null, extraDone = false, extraBusy = false, osmPref = 0;
let allVis = [], labels = [], hits = [], selIdx = -1;
let sync = false, head = null, sx = 0, sy = 0, gotOri = false, offset = 0;
const tiles = new Map();
try { offset = Number(localStorage.getItem('yama_offset')) || 0; } catch (e) {}

// ---------- 共通 ----------
const status = t => { $('status').textContent = t; };
const showErr = t => { $('err').textContent = t; };
const tick = () => new Promise(r => setTimeout(r));
const sleep = s => new Promise(r => setTimeout(r, s * 1000));
const norm360 = a => ((a % 360) + 360) % 360;
const xOf = az => (az + OFF) * PXD;
const obsKey = () => obs ? obs[0].toFixed(4) + ',' + obs[1].toFixed(4) : '';
function setData(id, f) { const s = map.getSource(id); if (s) s.setData({type:'FeatureCollection', features:f}); }
async function tfetch(url, opt, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, {...opt, signal:ctl.signal}); } finally { clearTimeout(t); }
}
const errText = (e, ms) => e.name === 'AbortError' ? `${ms / 1000}秒で応答なし` : e.message;
// Wikidataの返事を読む（時間切れで途中までしか届かなかった場合を見分ける）
async function readWd(r) {
  const text = await r.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error(/timeout/i.test(text) ? '時間切れ（Wikidataが混雑）' : 'データが途中で切れていました'); }
}
function distM(a, b) {
  const r = Math.PI / 180, dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function brg(a, b) {
  const r = Math.PI / 180, dl = (b[0] - a[0]) * r;
  const y = Math.sin(dl) * Math.cos(b[1] * r);
  const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos(dl);
  return norm360(Math.atan2(y, x) / r);
}
function dest(p, az, d) {
  const r = Math.PI / 180, la1 = p[1] * r, lo1 = p[0] * r, a = az * r, dr = d / R;
  const la2 = Math.asin(Math.sin(la1) * Math.cos(dr) + Math.cos(la1) * Math.sin(dr) * Math.cos(a));
  const lo2 = lo1 + Math.atan2(Math.sin(a) * Math.sin(dr) * Math.cos(la1), Math.cos(dr) - Math.sin(la1) * Math.sin(la2));
  return [lo2 / r, la2 / r];
}
const dirName = az => DIR8[Math.round(norm360(az) / 45) % 8];
// 見上げる角度（度）：地球の丸みと光の曲がりを考慮
const ang = (h, d, h0) => Math.atan((h - h0 - d * d / (2 * R) * (1 - K)) / d) * 180 / Math.PI;
function circle(c, m) {
  const pts = [], kx = 111320 * Math.cos(c[1] * Math.PI / 180);
  for (let i = 0; i <= 64; i++) { const a = i / 64 * 2 * Math.PI; pts.push([c[0] + m / kx * Math.sin(a), c[1] + m / 110574 * Math.cos(a)]); }
  return {type:'Feature', properties:{}, geometry:{type:'Polygon', coordinates:[pts]}};
}

// ---------- 地図 ----------
map.on('load', () => {
  const empty = {type:'FeatureCollection', features:[]};
  map.addSource('range', {type:'geojson', data:empty});
  map.addLayer({id:'range', type:'line', source:'range', paint:{'line-color':'#1f6fd1', 'line-width':1.5, 'line-dasharray':[2, 2]}});
  map.addSource('sel', {type:'geojson', data:empty});
  map.addLayer({id:'sel', type:'line', source:'sel', paint:{'line-color':'#c0392b', 'line-width':3}});
  if (obs) setData('range', [circle(obs, MAXD)]);
});
map.on('click', e => { if (pick) { pick = false; note = ''; run([e.lngLat.lng, e.lngLat.lat]); } });
function placeObs() {
  if (!obsMarker) obsMarker = new mapboxgl.Marker({color:'#1e90ff'}).setLngLat(obs).addTo(map);
  else obsMarker.setLngLat(obs);
  setData('range', [circle(obs, MAXD)]);
  map.jumpTo({center:obs, zoom:10});
}

// ---------- 標高タイル（国土地理院） ----------
const tc = document.createElement('canvas'); tc.width = tc.height = 256;
const tcx = tc.getContext('2d', {willReadFrequently:true});
function tileXY(lon, lat, z) {
  const n = 2 ** z, r = lat * Math.PI / 180;
  return [(lon + 180) / 360 * n, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n];
}
async function loadTile(z, x, y) {
  const key = z + '/' + x + '/' + y;
  if (tiles.has(key)) return;
  tiles.set(key, null);
  try {
    const r = await fetch(`https://cyberjapandata.gsi.go.jp/xyz/dem_png/${key}.png`);
    if (!r.ok) return;
    const bmp = await createImageBitmap(await r.blob());
    tcx.clearRect(0, 0, 256, 256); tcx.drawImage(bmp, 0, 0);
    const d = tcx.getImageData(0, 0, 256, 256).data, a = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) {
      const v = d[i * 4] * 65536 + d[i * 4 + 1] * 256 + d[i * 4 + 2];
      a[i] = v === 8388608 ? 0 : (v < 8388608 ? v : v - 16777216) * 0.01;
    }
    tiles.set(key, a);
  } catch (e) {}
}
function tileList(c, m, z) {
  const dLat = m / 110574, dLon = m / (111320 * Math.cos(c[1] * Math.PI / 180));
  const [x0, y0] = tileXY(c[0] - dLon, c[1] + dLat, z), [x1, y1] = tileXY(c[0] + dLon, c[1] - dLat, z), list = [];
  for (let x = Math.floor(x0); x <= Math.floor(x1); x++)
    for (let y = Math.floor(y0); y <= Math.floor(y1); y++) list.push([z, x, y]);
  return list;
}
async function loadAll(list) {
  let i = 0, done = 0;
  const worker = async () => {
    while (i < list.length) { const t = list[i++]; await loadTile(...t); done++; status(`地形を読み込み中… ${done}/${list.length}`); }
  };
  await Promise.all(Array.from({length:8}, worker));
}
function elevZ(lon, lat, z) {
  const [xf, yf] = tileXY(lon, lat, z), x = Math.floor(xf), y = Math.floor(yf);
  const a = tiles.get(z + '/' + x + '/' + y);
  if (a === undefined) return null;
  if (!a) return 0;
  return a[Math.min(255, Math.floor((yf - y) * 256)) * 256 + Math.min(255, Math.floor((xf - x) * 256))];
}
function elev(p, d) {
  if (d < NEAR) { const h = elevZ(p[0], p[1], 12); if (h !== null) return h; }
  return elevZ(p[0], p[1], 10) ?? 0;
}

// ---------- 稜線の計算 ----------
async function computeProfile(h0) {
  const N = Math.round(360 / STEP), cum = BANDS.map(() => new Float32Array(N).fill(-90));
  for (let i = 0; i < N; i++) {
    const az = i * STEP; let d = 30, b = 0, mx = -90;
    while (d <= MAXD) {
      while (b < BANDS.length && d > BANDS[b]) { cum[b][i] = mx; b++; }
      const a = ang(elev(dest(obs, az, d), d), d, h0);
      if (a > mx) mx = a;
      d += Math.max(30, d * 0.008);
    }
    for (; b < BANDS.length; b++) cum[b][i] = mx;
    if (i % 60 === 0) { status(`稜線を計算中… ${Math.round(i / N * 100)}%`); await tick(); }
  }
  return cum;
}

// ---------- 山の一覧（Wikidata）を地域ごとにスマホへ保存 ----------
// 保存形式：{regions:[{c:[経度,緯度], r:半径km, t:取得日時, nf:百名山の印が未取得なら1}], list:[[名前, 経度, 緯度, 標高, 百名山=1, ID]]}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (s && Array.isArray(s.list) && Array.isArray(s.regions)) return s;
  } catch (e) {}
  return {regions:[], list:[]};
}
function saveStore(s) {
  try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) { showErr('スマホへの保存に失敗しました（容量不足の可能性）'); }
}
function showStoreInfo() {
  const s = loadStore(), n = Object.keys(loadOsm().tiles).length;
  $('storeInfo').textContent = (s.regions.length
    ? `保存済み：${s.regions.length}地域・${s.list.length.toLocaleString()}座`
    : '山の一覧はまだ保存されていません') + (n ? `／細かい山 ${n}マス` : '');
}
// 日本百名山に属する山のID（Wikidata の「一部である」P361）
async function fetchF100() {
  const q = `SELECT ?i WHERE { ?h rdfs:label "日本百名山"@ja. ?i wdt:P361 ?h. }`;
  const r = await tfetch(WD + encodeURIComponent(q), {}, WAIT);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const ids = new Set(((await readWd(r)).results.bindings || []).map(b => b.i.value.replace(/.*\//, '')));
  if (ids.size < 50) throw new Error('百名山の一覧が足りません');
  return ids;
}
// 前回、百名山の印を取れなかった地域があれば取り直す
async function retryF100() {
  if (!loadStore().regions.some(x => x.nf)) return;
  try {
    const ids = await fetchF100(), s = loadStore();
    s.list.forEach(v => { if (ids.has(v[5])) v[4] = 1; });
    s.regions.forEach(x => { delete x.nf; });
    saveStore(s);
    let changed = false;
    baseVis.forEach(v => { if (v.id && ids.has(v.id) && !v.f100) { v.f100 = 1; changed = true; } });
    if (changed && !running) { refreshLabels(); doneStatus(); }
  } catch (e) {}
}
// この地点の計算範囲をまるごと含む保存済み地域
const coveringRegion = (s, p) => s.regions.find(r => distM(r.c, p) <= (r.r || FETCH_KM) * 1000 - MAXD);
async function fetchRegion(center) {
  // 位置の索引で近くの場所を先に絞り込み、その中から山を探す
  const q = `SELECT ?i ?l ?c ?e WHERE {
    SERVICE wikibase:around {
      ?i wdt:P625 ?c.
      bd:serviceParam wikibase:center "Point(${center[0].toFixed(4)} ${center[1].toFixed(4)})"^^geo:wktLiteral.
      bd:serviceParam wikibase:radius "${FETCH_KM}".
    }
    VALUES ?t { wd:Q8502 wd:Q8072 wd:Q169358 wd:Q54050 }
    ?i wdt:P31 ?t.
    OPTIONAL { ?i wdt:P2044 ?e }
    ?i rdfs:label ?l. FILTER(LANG(?l) = "ja")
  }`;
  const r = await tfetch(WD + encodeURIComponent(q), {}, WD_WAIT);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await readWd(r), byId = new Map();
  ((j.results && j.results.bindings) || []).forEach(b => {
    const m = /Point\(([-\d.]+) ([-\d.]+)\)/.exec(b.c.value);
    if (!m) return;
    const id = b.i.value.replace(/.*\//, ''), e = b.e ? Math.round(parseFloat(b.e.value)) : 0, old = byId.get(id);
    if (old) { if (e > old[3]) old[3] = e; return; }
    byId.set(id, [b.l.value, +(+m[1]).toFixed(4), +(+m[2]).toFixed(4), isFinite(e) ? e : 0, 0, id]);
  });
  if (!byId.size) throw new Error('この地域の山が見つかりませんでした');
  let f100ok = false;
  try { // 日本百名山の印
    const ids = await fetchF100();
    byId.forEach((v, id) => { if (ids.has(id)) v[4] = 1; });
    f100ok = true;
  } catch (e) {}
  const s = loadStore(), all = new Map(s.list.map(v => [v[5], v]));
  byId.forEach((v, id) => { const old = all.get(id); if (!f100ok && old && old[4]) v[4] = 1; all.set(id, v); });
  s.list = [...all.values()];
  const reg = {c:center, r:FETCH_KM, t:Date.now()};
  if (!f100ok) reg.nf = 1; // 百名山の印が未取得（次回取り直す）
  s.regions = s.regions.filter(x => distM(x.c, center) > 1000).concat([reg]);
  saveStore(s); showStoreInfo();
  return s;
}
function nearList(list) {
  const dLat = MAXD / 110574 + 0.01, dLon = MAXD / (111320 * Math.cos(obs[1] * Math.PI / 180)) + 0.01;
  return list.filter(v => Math.abs(v[2] - obs[1]) < dLat && Math.abs(v[1] - obs[0]) < dLon)
    .map(v => ({lon:v[1], lat:v[2], tags:{name:v[0], ele:String(v[3] || '')}, f100:v[4], id:v[5]}));
}

// ---------- 細かい山（OpenStreetMap）をマスごとにスマホへ保存 ----------
// 保存形式：{tiles:{"経度,緯度"（マスの南西の角）:{t:取得日時, l:[[名前, 経度, 緯度, 標高]]}}}
function loadOsm() {
  try {
    const c = JSON.parse(localStorage.getItem(OSM_STORE) || 'null');
    if (c && c.tiles && typeof c.tiles === 'object') return c;
  } catch (e) {}
  return {tiles:{}};
}
// 1マス分を保存（ほかの処理が保存した分を消さないよう、読み直してから足す）
function saveTile(k, tile) {
  const c = loadOsm(); c.tiles[k] = tile;
  let keys = Object.keys(c.tiles).sort((a, b) => c.tiles[a].t - c.tiles[b].t);
  while (keys.length > OSM_MAX) delete c.tiles[keys.shift()]; // 多すぎたら古いマスから消す
  for (let n = 0; n < 3; n++) {
    try { localStorage.setItem(OSM_STORE, JSON.stringify(c)); return; }
    catch (e) { // 容量不足なら古いマスを半分消して保存し直す
      keys = keys.filter(x => x !== k);
      if (!keys.length) break;
      keys.splice(0, Math.ceil(keys.length / 2)).forEach(x => delete c.tiles[x]);
    }
  }
  showErr('細かい山の保存に失敗しました（容量不足の可能性）');
}
// 計算範囲（半径150km）にかかるマス。近い順
function osmKeys(p) {
  const dLat = MAXD / 110574, dLon = MAXD / (111320 * Math.cos(p[1] * Math.PI / 180)), list = [];
  for (let x = Math.floor(p[0] - dLon); x <= Math.floor(p[0] + dLon); x++)
    for (let y = Math.floor(p[1] - dLat); y <= Math.floor(p[1] + dLat); y++) {
      const q = [Math.min(x + 1, Math.max(x, p[0])), Math.min(y + 1, Math.max(y, p[1]))], d = distM(p, q);
      if (d <= MAXD) list.push({k:x + ',' + y, x, y, d});
    }
  return list.sort((a, b) => a.d - b.d);
}
// 1マス分を取得。取得先を順に試す（前回うまくいった取得先から）
async function fetchTile(x, y) {
  const q = `[out:json][timeout:25];node["natural"~"^(peak|volcano)$"]["name"](${y},${x},${y + 1},${x + 1});out body;`;
  const errs = [];
  for (let n = 0; n < MIRRORS.length; n++) {
    const m = (osmPref + n) % MIRRORS.length;
    try {
      const r = await tfetch(MIRRORS[m].url, {method:'POST', body:'data=' + encodeURIComponent(q),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}}, WAIT);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if (j.remark && /error|timed out/i.test(j.remark)) throw new Error('時間切れ');
      osmPref = m;
      return (j.elements || []).map(e => {
        const t = e.tags || {}, name = t['name:ja'] || t.name;
        if (!name || !isFinite(e.lon) || !isFinite(e.lat)) return null;
        const h = parseFloat(String(t.ele || '').replace(/[^\d.]/g, ''));
        return [name, +e.lon.toFixed(4), +e.lat.toFixed(4), isFinite(h) ? Math.round(h) : 0];
      }).filter(Boolean);
    } catch (e) { errs.push(MIRRORS[m].name + ' ' + errText(e, WAIT)); }
  }
  throw new Error(errs.join('、'));
}
// この地点の細かい山。足りないマス・古いマスだけ取りに行く
async function osmPeaks(key, label) {
  const list = osmKeys(obs), now = Date.now(), old = t => !t || now - t.t > OSM_DAYS * 86400000;
  let c = loadOsm(), lastErr = '';
  const need = list.filter(m => old(c.tiles[m.k]));
  tiles: for (let i = 0; i < need.length; i++) {
    for (let round = 0; ; round++) {
      if (key !== obsKey()) return null;
      status(`${label}を取得中… ${i + 1}/${need.length}マス（初回のみ。混んでいるときは時間がかかります）`);
      try {
        saveTile(need[i].k, {t:Date.now(), l:await fetchTile(need[i].x, need[i].y)});
        lastErr = ''; await sleep(1); break; // サーバーに負担をかけないよう1秒あけて次のマスへ
      } catch (e) {
        lastErr = e.message;
        if (round >= OSM_RETRY) break tiles; // やり直しても無理なら、今回はここまで（次回は続きから）
        for (let s = OSM_PAUSE; s > 0; s--) { // 30秒待ってやり直す
          if (key !== obsKey()) return null;
          status(`${label}：取得先が混んでいます。${s}秒後にやり直します（${round + 1}/${OSM_RETRY}回目）　${i}/${need.length}マス取得済み`);
          await sleep(1);
        }
      }
    }
  }
  if (key !== obsKey()) return null;
  c = loadOsm(); showStoreInfo();
  const els = [];
  list.forEach(m => { const t = c.tiles[m.k]; if (t) t.l.forEach(v => els.push({lon:v[1], lat:v[2], tags:{name:v[0], ele:String(v[3] || '')}})); });
  return {els, lastErr, total:list.length,
    missing:list.filter(m => !c.tiles[m.k]).length, done:!list.some(m => old(c.tiles[m.k]))};
}
async function addExtra() {
  const key = obsKey();
  if ((extraFor === key && extraDone) || !prof || extraBusy) return;
  extraBusy = true;
  try {
    const res = await osmPeaks(key, '細かい山');
    if (!res) return;
    const base = baseVis.map(v => v.p), baseNames = baseVis.map(v => v.name);
    const fresh = res.els.filter(e => {
      const p = [e.lon, e.lat], n = e.tags.name;
      return !base.some((b, i) => { const d = distM(b, p); return d < 150 || (baseNames[i] === n && d < 3000); });
    });
    const vis = await checkPeaks(fresh, curH0);
    if (key !== obsKey()) return;
    extraVis = vis; extraFor = key; extraDone = res.done;
    refreshLabels(); doneStatus();
    if (res.lastErr) showErr(`細かい山：${res.missing ? `${res.total}マス中${res.missing}マスを取得できませんでした` : '古い保存データで表示しています'}（${res.lastErr}）。チェックを入れ直すか、次に計算したときに、足りない分だけ続きから取ります`);
  } catch (e) { showErr('細かい山の表示に失敗：' + e.message); doneStatus(); }
  finally {
    extraBusy = false;
    if (key !== obsKey() && $('many').checked && !running) addExtra(); // 途中で地点が変わったとき
  }
}

// ---------- 見えるかの判定 ----------
async function checkPeaks(els, h0) {
  const vis = [];
  for (let k = 0; k < els.length; k++) {
    const e = els[k], p = [e.lon, e.lat], D = distM(obs, p);
    if (D < 200 || D > MAXD || !e.tags) continue;
    const tagH = parseFloat(String(e.tags.ele || '').replace(/[^\d.]/g, ''));
    const h = Math.max(isFinite(tagH) ? tagH : 0, elev(p, D));
    const az = brg(obs, p), target = ang(h, D, h0), stop = D - Math.max(150, D * 0.015);
    // 先に計算した稜線で、手前の山に隠れているのがはっきりしている山は細かい判定を省く
    if (prof) {
      const N = prof[0].length, i0 = Math.floor(az / STEP) % N, i1 = (i0 + 1) % N;
      let b = -1; while (b + 1 < BANDS.length && BANDS[b + 1] < stop) b++;
      if (b >= 0 && Math.min(prof[b][i0], prof[b][i1]) > target + 0.05) {
        if (k % 200 === 0) { status(`見える山を判定中… ${k}/${els.length}`); await tick(); }
        continue;
      }
    }
    let d = 30, ok = true;
    while (d < stop) {
      if (ang(elev(dest(obs, az, d), d), d, h0) > target + 0.02) { ok = false; break; }
      d += Math.max(30, d * 0.008);
    }
    if (ok) vis.push({name:e.tags['name:ja'] || e.tags.name, h:Math.round(h), d:D, az, a:target, p, f100:e.f100 || 0, id:e.id});
    if (k % 200 === 0) { status(`見える山を判定中… ${k}/${els.length}`); await tick(); }
  }
  return vis;
}
function placeLabels() {
  const sp = $('many').checked ? 11 : 17, W = 360 * PXD;
  labels = [];
  [...allVis].sort((x, y) => (y.h + y.f100 * 3000) - (x.h + x.f100 * 3000)).forEach(v => {
    const x = v.az * PXD;
    if (labels.some(l => { const dx = Math.abs(l.az * PXD - x); return dx < sp || dx > W - sp; })) return;
    labels.push(v);
  });
}
function refreshLabels() {
  allVis = baseVis.concat($('many').checked ? extraVis : []);
  placeLabels(); selIdx = -1; draw(); showInfo();
}
function doneStatus() {
  const extra = $('many').checked && extraFor === obsKey() ? `＋細かい山 ${extraVis.length}座` : '';
  status(`${note}見える山 ${baseVis.length}座${extra}（表示 ${labels.length}座）　山名：${srcName}　この地点の標高 約${Math.round(curH0)}m`);
}

// ---------- パノラマ図 ----------
function draw() {
  const W = Math.round((360 + OFF * 2) * PXD), c = $('pano'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#d8e6f5'); sky.addColorStop(1, '#f6f9fc');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  hits = [];
  if (!prof) return;
  const N = prof[0].length, offN = Math.round(OFF / STEP), far = prof[prof.length - 1];
  let lo = Infinity, hi = -Infinity;
  far.forEach(v => { if (v < lo) lo = v; if (v > hi) hi = v; });
  labels.forEach(l => { if (l.a > hi) hi = l.a; });
  lo -= 0.3; hi += 0.4;
  const plotBot = H - AXIS, y = a => plotBot - (Math.max(lo, a) - lo) / (hi - lo) * (plotBot - TOP);
  for (let b = BANDS.length - 1; b >= 0; b--) {
    const arr = prof[b];
    g.beginPath(); g.moveTo(0, plotBot);
    for (let k = -offN; k <= N + offN; k++) g.lineTo(xOf(k * STEP), y(arr[((k % N) + N) % N]));
    g.lineTo(W, plotBot); g.closePath();
    g.fillStyle = COLS[b]; g.fill();
  }
  g.fillStyle = '#fff'; g.fillRect(0, plotBot, W, AXIS);
  g.textAlign = 'center';
  for (let az = -OFF; az <= 360 + OFF; az += 5) {
    const x = xOf(az), a = norm360(az);
    g.fillStyle = '#333'; g.fillRect(x, plotBot, 1, a % 45 === 0 ? 8 : 4);
    if (a % 45 === 0) { g.font = 'bold 13px sans-serif'; g.fillText(DIR8[a / 45], x, plotBot + 19); }
    else if (a % 15 === 0) { g.font = '11px sans-serif'; g.fillStyle = '#999'; g.fillText(a + '°', x, plotBot + 18); }
  }
  labels.forEach((l, k) => {
    const sel = k === selIdx, name = l.name.length > 7 ? l.name.slice(0, 7) : l.name, py = y(l.a);
    const col = sel ? '#c0392b' : (l.f100 ? '#8b4513' : '#222');
    [-360, 0, 360].forEach(s => {
      const x = xOf(l.az + s);
      if (x < -20 || x > W + 20) return;
      hits.push({x, k});
      g.strokeStyle = sel ? '#c0392b' : (l.f100 ? '#8b4513' : '#555'); g.lineWidth = sel || l.f100 ? 2 : 1;
      g.beginPath(); g.moveTo(x, 8 + name.length * 14); g.lineTo(x, py); g.stroke();
      g.fillStyle = col; g.font = (sel || l.f100 ? 'bold ' : '') + '13px sans-serif';
      for (let i = 0; i < name.length; i++) g.fillText(name[i], x, 18 + i * 14);
      g.beginPath(); g.arc(x, py, l.f100 ? 3.5 : 2.5, 0, 7); g.fill();
    });
  });
}
function scrollToAz(az) { $('panoWrap').scrollLeft = xOf(norm360(az)) - $('panoWrap').clientWidth / 2; }
$('pano').onclick = e => {
  const x = e.clientX - $('pano').getBoundingClientRect().left;
  let best = -1, bd = 10;
  hits.forEach(h => { const dd = Math.abs(h.x - x); if (dd < bd) { bd = dd; best = h.k; } });
  selIdx = best; draw(); showInfo();
};
function showInfo() {
  const l = labels[selIdx];
  if (!l) { $('info').textContent = '山名をタップすると詳細が出ます'; setData('sel', []); return; }
  $('info').textContent = `${l.name}${l.f100 ? '（日本百名山）' : ''}　標高${l.h.toLocaleString()}m・${dirName(l.az)}（方位${Math.round(l.az)}°）・${(l.d / 1000).toFixed(1)}km`;
  setData('sel', [{type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:[obs, l.p]}}]);
}

// ---------- スマホの向き ----------
// 背面カメラが向いている方角（立てて持つ）。水平に近いときは上端の向き
function headingFrom(a, b, g) {
  const r = Math.PI / 180, cA = Math.cos(a * r), sA = Math.sin(a * r), cB = Math.cos(b * r), sB = Math.sin(b * r),
    cG = Math.cos(g * r), sG = Math.sin(g * r);
  let vx = -(cG * sA * sB + cA * sG), vy = -(sA * sG - cA * cG * sB);
  const vz = -cB * cG;
  if (Math.abs(vz) > 0.8) { vx = -cB * sA; vy = cA * cB; }
  return norm360(Math.atan2(vx, vy) / r);
}
function onOri(e) {
  let h;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.alpha != null && (e.type === 'deviceorientationabsolute' || e.absolute)) h = headingFrom(e.alpha, e.beta || 0, e.gamma || 0);
  else return;
  gotOri = true;
  const r = Math.PI / 180;
  sx = sx * 0.8 + Math.sin(h * r) * 0.2; sy = sy * 0.8 + Math.cos(h * r) * 0.2;
  head = norm360(Math.atan2(sx, sy) / r + offset);
}
if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOri);
else window.addEventListener('deviceorientation', onOri);
function loop() {
  if (sync && head != null) {
    scrollToAz(head);
    $('dirInfo').textContent = `いま向いている方向：${dirName(head)} ${Math.round(head)}°`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function setSync(on) {
  sync = on;
  $('syncBtn').classList.toggle('on', on);
  $('syncBtn').textContent = on ? '向きに合わせる：ON' : '向きに合わせる';
  $('center').style.display = on ? 'block' : 'none';
  if (!on) $('dirInfo').textContent = '';
  if (on) setTimeout(() => { if (sync && !gotOri) { $('dirInfo').textContent = 'この端末では方位センサーが使えないようです'; } }, 1500);
}
$('syncBtn').onclick = () => setSync(!sync);
['touchstart', 'mousedown', 'wheel'].forEach(ev => $('panoWrap').addEventListener(ev, () => { if (sync) setSync(false); }, {passive:true}));
function showOffset() { $('offVal').textContent = (offset > 0 ? '+' : '') + offset + '°'; }
function changeOffset(d) {
  offset += d; showOffset();
  try { localStorage.setItem('yama_offset', String(offset)); } catch (e) {}
}
$('offMinus').onclick = () => changeOffset(-2);
$('offPlus').onclick = () => changeOffset(2);
showOffset();

// ---------- 実行 ----------
async function run(p) {
  if (running) return;
  running = true; obs = p; selIdx = -1; prof = null; labels = []; allVis = []; baseVis = []; extraVis = []; extraFor = null; extraDone = false;
  showErr(''); draw(); showInfo(); placeObs();
  const errs = [];
  let staleRegion = null;
  try {
    const st = loadStore(), reg = coveringRegion(st, obs);
    let listP;
    if (reg) {
      listP = Promise.resolve(st.list);
      if (Date.now() - reg.t > KEEP_DAYS * 86400000) staleRegion = reg;
    } else {
      const center = [+obs[0].toFixed(2), +obs[1].toFixed(2)];
      listP = fetchRegion(center).then(s => s.list).catch(e => { errs.push('Wikidata：' + errText(e, WD_WAIT)); return null; });
    }
    await loadAll(tileList(obs, MAXD, 10).concat(tileList(obs, NEAR + 2000, 12)));
    curH0 = elev(obs, 0) + Math.max(0, Number($('eye').value) || 0);
    prof = await computeProfile(curH0);
    draw(); // 山並みを先に表示
    status(reg ? '山名を判定中…' : 'この地域の山の一覧を取得中…（初回のみ、最大70秒ほど）');
    const list = await listP;
    let els;
    if (list) {
      els = nearList(list); srcName = 'スマホに保存した一覧';
      const r2 = coveringRegion(loadStore(), obs);
      if (r2 && r2.nf) errs.push('百名山の印を取得できませんでした（次回の計算で取り直します）');
    } else { // Wikidataが使えないときは OpenStreetMap で代わりに
      const res = await osmPeaks(obsKey(), '予備の山名');
      els = res ? res.els : []; srcName = els.length ? 'OpenStreetMap' : 'なし';
      if (res && res.lastErr) errs.push('OpenStreetMap：' + res.lastErr);
    }
    if (errs.length) showErr((list || els.length ? '' : '山名を取得できませんでした。少し待って「現在地で計算」を押し直してください　') + errs.join(' ／ '));
    baseVis = await checkPeaks(els, curH0);
    refreshLabels();
    if (labels[0] && !sync) scrollToAz(labels[0].az);
    doneStatus();
  } catch (e) { showErr('計算エラー：' + e.message); }
  finally { running = false; }
  if ($('many').checked) addExtra();
  // 裏側で：古くなった地域の取り直し → 百名山の印の取り直し
  (staleRegion ? fetchRegion(staleRegion.c).catch(() => {}) : Promise.resolve()).then(retryF100);
}
function useGps() {
  if (!('geolocation' in navigator)) { note = '※現在地が使えないため南大沢付近で計算　'; run(DEF); return; }
  status('現在地を取得中…');
  navigator.geolocation.getCurrentPosition(
    g => { note = ''; run([g.coords.longitude, g.coords.latitude]); },
    e => { note = '※現在地が取れないため南大沢付近で計算　'; showErr('位置情報：' + e.message); run(DEF); },
    {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
}
$('gpsBtn').onclick = useGps;
$('pickBtn').onclick = () => { pick = true; status('地図上の地点をタップしてください'); };
$('many').onchange = () => { refreshLabels(); doneStatus(); if ($('many').checked && !running) addExtra(); };
$('eye').onchange = () => { if (obs) run(obs); };
$('refreshBtn').onclick = () => {
  if (running) return;
  if (!confirm('保存した山の一覧（細かい山も含む）を消して、取り直します。よろしいですか？')) return;
  try { localStorage.removeItem(STORE); localStorage.removeItem(OSM_STORE); localStorage.removeItem('yama_peaks_v1'); } catch (e) {}
  showStoreInfo();
  if (obs) run(obs);
};
document.querySelectorAll('button[data-az]').forEach(b => b.onclick = () => { setSync(false); scrollToAz(Number(b.dataset.az)); });
try { localStorage.removeItem('yama_peaks_v1'); } catch (e) {} // 前の版の保存データは使わないので消す
showStoreInfo();
draw();
useGps();
</script>
</body>
</html>
